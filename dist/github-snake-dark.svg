<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 160" width="100%" height="160">
  <defs>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="snakeHead" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ffff"/>
      <stop offset="100%" stop-color="#50fa7b"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .bg-box { fill: url(#gridGrad); stroke: #30363d; stroke-width: 1; rx: 8; }
    .cell { fill: #161b22; rx: 2.5; }
    .active-1 { fill: #0e4429; }
    .active-2 { fill: #006d32; }
    .active-3 { fill: #26a641; }
    .active-4 { fill: #39d353; filter: drop-shadow(0 0 3px #39d353); }
    
    /* Snake animation path */
    .snake-body {
      fill: none;
      stroke: url(#snakeHead);
      stroke-width: 8;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 40 400;
      animation: slither 6s ease-in-out infinite alternate;
      filter: url(#neonGlow);
    }

    @keyframes slither {
      0% { stroke-dashoffset: 440; }
      100% { stroke-dashoffset: 0; }
    }
  </style>

  <!-- Background container -->
  <rect width="850" height="160" class="bg-box"/>

  <!-- Contribution Grid pattern -->
  <g transform="translate(30, 25)">
    <!-- 53 columns x 7 rows -->
    <!-- Column 1-10 -->
    <rect x="0" y="0" width="11" height="11" class="cell active-1"/>
    <rect x="0" y="15" width="11" height="11" class="cell"/>
    <rect x="0" y="30" width="11" height="11" class="cell active-2"/>
    <rect x="0" y="45" width="11" height="11" class="cell"/>
    <rect x="0" y="60" width="11" height="11" class="cell active-3"/>
    <rect x="0" y="75" width="11" height="11" class="cell"/>
    <rect x="0" y="90" width="11" height="11" class="cell"/>

    <rect x="15" y="0" width="11" height="11" class="cell"/>
    <rect x="15" y="15" width="11" height="11" class="cell active-1"/>
    <rect x="15" y="30" width="11" height="11" class="cell"/>
    <rect x="15" y="45" width="11" height="11" class="cell active-4"/>
    <rect x="15" y="60" width="11" height="11" class="cell"/>
    <rect x="15" y="75" width="11" height="11" class="cell active-2"/>
    <rect x="15" y="90" width="11" height="11" class="cell"/>

    <rect x="30" y="0" width="11" height="11" class="cell active-2"/>
    <rect x="30" y="15" width="11" height="11" class="cell"/>
    <rect x="30" y="30" width="11" height="11" class="cell active-3"/>
    <rect x="30" y="45" width="11" height="11" class="cell"/>
    <rect x="30" y="60" width="11" height="11" class="cell active-1"/>
    <rect x="30" y="75" width="11" height="11" class="cell active-4"/>
    <rect x="30" y="90" width="11" height="11" class="cell"/>

    <rect x="45" y="0" width="11" height="11" class="cell"/>
    <rect x="45" y="15" width="11" height="11" class="cell active-3"/>
    <rect x="45" y="30" width="11" height="11" class="cell"/>
    <rect x="45" y="45" width="11" height="11" class="cell active-2"/>
    <rect x="45" y="60" width="11" height="11" class="cell"/>
    <rect x="45" y="75" width="11" height="11" class="cell active-1"/>
    <rect x="45" y="90" width="11" height="11" class="cell active-4"/>

    <!-- Additional visual clusters -->
