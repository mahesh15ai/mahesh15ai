    </g>

    <!-- Animated Snake Body & Path -->
    <path class="snake-body" d="M 5,95 L 45,95 L 45,35 L 120,35 L 120,80 L 210,80 L 210,20 L 320,20 L 320,65 L 430,65 L 430,20 L 540,20 L 540,80 L 650,80 L 650,35 L 750,35" />
